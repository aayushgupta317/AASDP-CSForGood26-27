<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan-A-Scam - Upload & Analyze</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/upload.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">🛡️ Scan-A-Scam</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="upload.html" class="active">Scan</a>
            <a href="community.html">Community</a>
            <a href="caregiver.html">Caregivers</a>
        </nav>
    </header>

    <main class="upload-container">
        <h1>Scan a Message or Screenshot</h1>
        <p>Paste suspicious text messages, emails, or upload a screenshot below to check for fraud patterns.</p>

        <div class="upload-card">
            <form id="scan-form">
                <div class="form-group">
                    <label for="scam-text">Paste Suspicious Text or Link:</label>
                    <textarea id="scam-text" rows="6" placeholder="e.g., URGENT: Your bank account has been locked. Click here to verify..."></textarea>
                </div>

                <div class="form-group file-upload-box">
                    <label for="scam-file">Or Upload Image / Screenshot:</label>
                    <input type="file" id="scam-file" accept="image/*">
                </div>

                <button type="submit" id="analyze-btn" class="btn-primary">Analyze with AI 🔍</button>
            </form>

            <div id="loading-spinner" class="hidden" style="text-align: center; padding: 40px;">
                <div class="spinner"></div>
                <p style="margin-top: 15px; font-weight: 600; color: #334155;">Analyzing content with Gemini AI security engine...</p>
            </div>
        </div>
    </main>

    <script src="../js/ai-integration.js"></script>
    <script>
        document.getElementById('scan-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const textInput = document.getElementById('scam-text').value.trim();
            const fileInput = document.getElementById('scam-file').files[0];

            if (!textInput && !fileInput) {
                alert('Please enter text or upload an image to analyze.');
                return;
            }

            document.getElementById('scan-form').style.display = 'none';
            document.getElementById('loading-spinner').classList.remove('hidden');

            let contentToAnalyze = textInput;
            if (fileInput) {
                contentToAnalyze += ` [User uploaded image file: ${fileInput.name}]`;
            }

            const analysisResult = await analyzeScamContent(contentToAnalyze);
            sessionStorage.setItem('scanResult', JSON.stringify(analysisResult));
            window.location.href = 'results.html';
        });
    </script>
</body>
</html>
